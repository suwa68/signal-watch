name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false

      - name: Run tests
        run: go test -count=1 -timeout=5m ./...

      - name: Run race tests
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go test -race -count=1 -timeout=5m ./...

      - name: Run go vet
        run: go vet ./...

  monitoring-acceptance:
    name: Monitoring acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run offline production-image acceptance
        env:
          SIGNALWATCH_ACCEPTANCE_LOG_DIR: ${{ runner.temp }}/monitoring-acceptance
        run: integration/monitor/acceptance.sh

      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/monitoring-acceptance
          retention-days: 7
          if-no-files-found: error
